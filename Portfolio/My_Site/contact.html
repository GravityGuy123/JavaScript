<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me - Design Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/My_Site/CSS/style.css">
    <style>
        .form-control, .form-select { background-color: #2a2a3e; color: #e0e0e0; border-color: #00f5d4;}
        .form-control::placeholder { color: #aaa; }
        .form-control:focus, .form-select:focus { background-color: #3a3a4e; color: #e0e0e0; border-color: #00f5d4; box-shadow: 0 0 0 0.25rem rgba(0, 245, 212, 0.25); }
        label { color: #00f5d4; }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="home.html">Your Name / Brand</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Section -->
    <main class="container mt-5 mb-5">
      <section id="contact-form" class="py-5">
        <h1 class="text-center display-5 mb-5">Get In Touch</h1>
        <div class="row justify-content-center">
          <div class="col-md-8">
            <p class="text-center mb-4">
              Have a project in mind or just want to say hi? Fill out the form below or reach out via email.
            </p>
            <form>
              <div class="mb-3">
                <label for="contactName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="contactName" placeholder="Your Name" required>
              </div>
              <div class="mb-3">
                <label for="contactEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="contactEmail" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="contactSubject" class="form-label">Subject</label>
                <input type="text" class="form-control" id="contactSubject" placeholder="Project Inquiry">
              </div>
              <div class="mb-3">
                <label for="contactMessage" class="form-label">Message</label>
                <textarea class="form-control" id="contactMessage" rows="5" placeholder="Your message here..." required></textarea>
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-lg accent-bg-color">Send Message</button>
              </div>
            </form>
            <div class="text-center mt-4">
                <p>Or reach me at: <a href="mailto:your.email@example.com" style="color: #00f5d4;">your.email@example.com</a></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
      <div class="container">
        <p>&copy; 2023 Your Name / Brand. All Rights Reserved.</p>
        <a href="#" class="text-white me-2"><i class="bi bi-linkedin"></i></a>
        <a href="#" class="text-white me-2"><i class="bi bi-github"></i></a>
        <a href="#" class="text-white"><i class="bi bi-behance"></i></a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
