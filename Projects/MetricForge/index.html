<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetricForge | Unit Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07111b;
      --panel: #0d1726;
      --panel-2: #111f33;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f7fb;
      --text-soft: #aebacf;
      --accent: #76a9ff;
      --accent-2: #79f2ce;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(118, 169, 255, 0.15), transparent 28%),
        radial-gradient(circle at top right, rgba(121, 242, 206, 0.1), transparent 24%),
        linear-gradient(180deg, #050c14 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .converter {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)), var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 1.1rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      color: var(--text-soft);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.9rem;
    }

    .badge::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    h1 {
      font-size: 1.7rem;
      line-height: 1.05;
      margin-bottom: 0.5rem;
    }

    .intro {
      color: var(--text-soft);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 1.1rem;
    }

    .form {
      display: grid;
      gap: 0.9rem;
    }

    .field {
      display: grid;
      gap: 0.45rem;
    }

    label {
      font-size: 0.84rem;
      color: var(--text-soft);
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      height: 3.2rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 0.95rem;
      outline: none;
    }

    input::placeholder {
      color: #7e8ca0;
    }

    input:focus,
    select:focus {
      border-color: rgba(118, 169, 255, 0.55);
    }

    .units {
      display: grid;
      gap: 0.9rem;
    }

    .result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(118, 169, 255, 0.08), rgba(255,255,255,0.02)),
        var(--panel-2);
    }

    .result-label {
      font-size: 0.74rem;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    @media (min-width: 640px) {
      .converter {
        padding: 1.4rem;
      }

      .units {
        grid-template-columns: 1fr 1fr;
      }

      h1 {
        font-size: 2rem;
      }

      .result-value {
        font-size: 2.1rem;
      }
    }
  </style>
</head>
<body>
  <main class="converter">
    <div class="badge">MetricForge</div>

    <h1>Unit Converter</h1>
    <p class="intro">
      Convert values between millimetres, centimetres, decimetres, metres, and kilometres.
    </p>

    <div class="form">
      <div class="field">
        <label for="value">Value</label>
        <input type="number" id="value" placeholder="Enter value" />
      </div>

      <div class="units">
        <div class="field">
          <label for="fromUnit">From</label>
          <select id="fromUnit">
            <option value="mm">Millimetre (mm)</option>
            <option value="cm">Centimetre (cm)</option>
            <option value="dm">Decimetre (dm)</option>
            <option value="m">Metre (m)</option>
            <option value="km">Kilometre (km)</option>
          </select>
        </div>

        <div class="field">
          <label for="toUnit">To</label>
          <select id="toUnit">
            <option value="mm">Millimetre (mm)</option>
            <option value="cm">Centimetre (cm)</option>
            <option value="dm">Decimetre (dm)</option>
            <option value="m">Metre (m)</option>
            <option value="km">Kilometre (km)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="result">
      <div class="result-label">Conversion</div>
      <div class="result-value" id="result">0 m</div>
    </div>
  </main>
</body>
</html>
