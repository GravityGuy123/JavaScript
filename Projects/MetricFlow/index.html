<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MetricFlow - Precision Unit Converter</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --page-max-width: 1400px;

            /* Growth phase widths */
            --content-fluid-max: 920px;
            --card-fluid-max: 760px;

            /* Locked design size from 850px and above */
            --content-locked-width: 850px;
            --intro-locked-width: 760px;
            --card-locked-width: 720px;

            --bg-deep: #020714;
            --bg-overlay-1: rgba(2, 7, 20, 0.74);
            --bg-overlay-2: rgba(2, 7, 20, 0.92);

            --text-main: #f7fbff;
            --text-soft: #c8d5e6;
            --text-muted: #8595ad;

            --accent: #1edbfc;
            --accent-2: #73b5ff;
            --accent-soft: #a2f2ff;

            --line: rgba(123, 178, 255, 0.12);

            --panel-top: rgba(17, 29, 54, 0.58);
            --panel-bottom: rgba(6, 14, 28, 0.92);
            --surface-top: rgba(255, 255, 255, 0.03);
            --surface-bottom: rgba(255, 255, 255, 0.012);

            --shadow-main: 0 28px 80px rgba(0, 0, 0, 0.46);
            --shadow-soft: 0 10px 26px rgba(0, 0, 0, 0.2);

            --radius-xl: 30px;
            --radius-lg: 22px;
            --radius-md: 18px;
            --radius-sm: 14px;

            --page-padding-x: 12px;
            --page-padding-top: 18px;
            --page-padding-bottom: 28px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text-soft);
            background:
                radial-gradient(circle at top center, rgba(41, 125, 255, 0.12), transparent 24%),
                radial-gradient(circle at 50% 82%, rgba(30, 219, 252, 0.11), transparent 18%),
                linear-gradient(var(--bg-overlay-1), var(--bg-overlay-2)),
                url("bg.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding:
                var(--page-padding-top)
                var(--page-padding-x)
                var(--page-padding-bottom);
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .page {
            width: 100%;
            max-width: var(--page-max-width);
            display: flex;
            justify-content: center;
        }

        .container {
            width: min(100%, var(--content-fluid-max));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        .brand-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .logo-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-row img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            filter:
                drop-shadow(0 0 18px rgba(30, 219, 252, 0.28))
                drop-shadow(0 0 30px rgba(30, 219, 252, 0.12));
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-copy h1 {
            color: var(--text-main);
            font-size: 1.95rem;
            line-height: 0.95;
            letter-spacing: -0.05em;
            font-weight: 800;
        }

        .brand-copy .flow {
            color: var(--accent);
            text-shadow: 0 0 20px rgba(30, 219, 252, 0.24);
        }

        .caption {
            color: #dce8f9;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .logo-divider {
            width: min(94%, 740px);
            height: 2px;
            border: none;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(255, 255, 255, 0.08) 16%,
                rgba(30, 219, 252, 0.95) 50%,
                rgba(255, 255, 255, 0.08) 84%,
                transparent 100%
            );
            box-shadow: 0 0 18px rgba(30, 219, 252, 0.24);
        }

        .intro {
            width: 100%;
            max-width: 760px;
            text-align: center;
            padding-inline: 2px;
        }

        .intro p {
            color: var(--text-soft);
            font-size: 0.96rem;
            line-height: 1.65;
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .calc-shell {
            width: min(100%, var(--card-fluid-max));
            position: relative;
            border-radius: 24px;
            padding: 10px;
            background:
                linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bottom) 100%);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-main);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            overflow: hidden;
            isolation: isolate;
        }

        .calc-shell::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background:
                radial-gradient(circle at 50% 0%, rgba(30, 219, 252, 0.12), transparent 24%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 28%);
            pointer-events: none;
            z-index: 0;
        }

        .calc-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                inset 0 0 0 1px rgba(255, 255, 255, 0.012);
            pointer-events: none;
            z-index: 0;
        }

        .edge-glow-left,
        .edge-glow-right {
            position: absolute;
            top: 36%;
            width: 8px;
            height: 86px;
            border-radius: 999px;
            background: linear-gradient(
                180deg,
                rgba(30, 219, 252, 0.02),
                rgba(30, 219, 252, 0.72),
                rgba(30, 219, 252, 0.02)
            );
            z-index: 0;
        }

        .edge-glow-left {
            left: -1px;
        }

        .edge-glow-right {
            right: -1px;
        }

        .calc-panel {
            position: relative;
            z-index: 1;
            border-radius: 18px;
            padding: 12px;
            background:
                linear-gradient(180deg, var(--surface-top) 0%, var(--surface-bottom) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .value-block {
            margin-bottom: 12px;
        }

        .field-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .field-heading hr {
            flex: 1;
            border: none;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.14),
                transparent
            );
        }

        .field-heading p {
            color: #dbe8f9;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .value-input {
            width: 100%;
            height: 64px;
            border: 1px solid rgba(120, 180, 255, 0.14);
            border-radius: 16px;
            background:
                linear-gradient(
                    180deg,
                    rgba(3, 10, 22, 0.95) 0%,
                    rgba(4, 12, 24, 0.995) 100%
                );
            color: var(--text-main);
            text-align: center;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            padding: 0 14px;
            outline: none;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.015),
                0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .value-input::placeholder {
            color: rgba(215, 227, 244, 0.28);
            letter-spacing: -0.03em;
        }

        .value-input:focus {
            border-color: rgba(30, 219, 252, 0.32);
            box-shadow:
                0 0 0 4px rgba(30, 219, 252, 0.08),
                0 0 24px rgba(30, 219, 252, 0.09);
        }

        .unit-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .select-wrap {
            position: relative;
            min-width: 0;
        }

        .select-wrap select {
            width: 100%;
            height: 56px;
            border: 1px solid rgba(120, 180, 255, 0.14);
            border-radius: 14px;
            background:
                linear-gradient(
                    180deg,
                    rgba(15, 25, 45, 0.96) 0%,
                    rgba(7, 15, 29, 0.98) 100%
                );
            color: var(--text-main);
            font-size: 0.96rem;
            font-weight: 700;
            padding: 0 42px 0 14px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            text-overflow: ellipsis;
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 16px;
            width: 10px;
            height: 10px;
            border-right: 2px solid #dce8fb;
            border-bottom: 2px solid #dce8fb;
            transform: translateY(-65%) rotate(45deg);
            pointer-events: none;
            opacity: 0.9;
        }

        .select-wrap select:focus {
            border-color: rgba(30, 219, 252, 0.34);
            box-shadow:
                0 0 0 4px rgba(30, 219, 252, 0.08),
                0 0 18px rgba(30, 219, 252, 0.08);
        }

        .swap-wrap {
            display: flex;
            justify-content: center;
        }

        .swap-button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(120, 180, 255, 0.18);
            background:
                radial-gradient(circle at 50% 18%, rgba(60, 112, 197, 0.95), rgba(7, 15, 29, 0.98));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #edf8ff;
            font-size: 1.55rem;
            box-shadow:
                0 0 0 8px rgba(30, 219, 252, 0.03),
                0 10px 24px rgba(0, 0, 0, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            user-select: none;
        }

        .result-box {
            position: relative;
            border-radius: 18px;
            border: 1px solid rgba(120, 180, 255, 0.11);
            background:
                radial-gradient(circle at center, rgba(30, 219, 252, 0.05), transparent 54%),
                linear-gradient(
                    180deg,
                    rgba(5, 13, 26, 0.96),
                    rgba(4, 12, 22, 0.99)
                );
            padding: 18px 12px 16px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .result-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(30, 219, 252, 0.08), transparent 28%);
            pointer-events: none;
        }

        .result-line {
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .result-line h2,
        .result-line span {
            font-weight: 800;
            letter-spacing: -0.055em;
        }

        .result-line h2 {
            color: #dff8ff;
            font-size: 1.95rem;
            line-height: 1;
            text-shadow: 0 0 18px rgba(30, 219, 252, 0.08);
        }

        .result-line span {
            color: var(--text-main);
            font-size: 1.5rem;
            line-height: 1;
        }

        .accuracy-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }

        .accuracy-line::before {
            content: "➜";
            color: var(--accent);
            font-size: 0.95rem;
            text-shadow: 0 0 10px rgba(30, 219, 252, 0.38);
        }

        .accuracy-line p {
            color: var(--accent-soft);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .metrics-strip {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .metric-item {
            color: #dde9fb;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            width: 100%;
            padding: 2px 0;
        }

        @media (min-width: 480px) {
            :root {
                --page-padding-x: 16px;
                --page-padding-top: 22px;
                --page-padding-bottom: 32px;
            }

            .container {
                gap: 18px;
            }

            .brand-copy h1 {
                font-size: 2.3rem;
            }

            .caption {
                font-size: 1rem;
            }

            .intro p {
                font-size: 1rem;
            }

            .calc-shell {
                border-radius: 26px;
                padding: 12px;
            }

            .calc-panel {
                border-radius: 20px;
                padding: 14px;
            }

            .value-input {
                height: 68px;
                font-size: 2rem;
            }

            .result-line h2 {
                font-size: 2.2rem;
            }

            .result-line span {
                font-size: 1.7rem;
            }
        }

        @media (min-width: 640px) {
            :root {
                --page-padding-top: 28px;
                --page-padding-bottom: 36px;
            }

            .container {
                gap: 22px;
            }

            .logo-row {
                flex-direction: row;
                gap: 14px;
            }

            .logo-row img {
                width: 62px;
                height: 62px;
            }

            .brand-copy {
                align-items: flex-start;
            }

            .brand-copy h1 {
                font-size: 3rem;
            }

            .caption {
                font-size: 1.05rem;
            }

            .intro p {
                font-size: 1.04rem;
                line-height: 1.7;
            }

            .calc-shell {
                padding: 14px;
            }

            .calc-panel {
                padding: 16px;
            }

            .field-heading p {
                font-size: 0.84rem;
            }

            .value-input {
                height: 72px;
                font-size: 2.4rem;
            }

            .unit-row {
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 12px;
            }

            .swap-button {
                width: 60px;
                height: 60px;
                font-size: 1.7rem;
            }

            .result-box {
                border-radius: 20px;
                padding: 22px 16px 18px;
            }

            .result-line h2 {
                font-size: 2.8rem;
            }

            .result-line span {
                font-size: 2.2rem;
            }

            .accuracy-line p {
                font-size: 0.95rem;
            }

            .metrics-strip {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0;
            }

            .metric-item {
                width: auto;
                padding: 6px 14px;
                position: relative;
                font-size: 0.92rem;
            }

            .metric-item:not(:last-child)::after {
                content: "";
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 1px;
                height: 16px;
                background: rgba(255, 255, 255, 0.12);
            }

            .edge-glow-left,
            .edge-glow-right {
                height: 96px;
            }
        }

        /* LOCK THE DESIGN HERE */
        @media (min-width: 850px) {
            .container {
                width: var(--content-locked-width);
                max-width: var(--content-locked-width);
                gap: 26px;
            }

            .intro {
                width: var(--intro-locked-width);
                max-width: var(--intro-locked-width);
            }

            .calc-shell {
                width: var(--card-locked-width);
                max-width: var(--card-locked-width);
                border-radius: 28px;
                padding: 16px;
            }

            .calc-panel {
                border-radius: 22px;
                padding: 18px;
            }

            .brand-copy h1 {
                font-size: 3.35rem;
            }

            .caption {
                font-size: 1.05rem;
            }

            .intro p {
                font-size: 1.08rem;
                line-height: 1.7;
            }

            .logo-divider {
                width: 720px;
                max-width: 720px;
            }

            .field-heading {
                margin-bottom: 14px;
            }

            .field-heading p {
                font-size: 0.86rem;
            }

            .value-input {
                height: 76px;
                font-size: 2.85rem;
            }

            .select-wrap select {
                height: 60px;
                font-size: 1rem;
                padding-left: 16px;
                padding-right: 46px;
            }

            .swap-button {
                width: 62px;
                height: 62px;
                font-size: 1.8rem;
            }

            .result-box {
                padding: 24px 18px 18px;
                border-radius: 20px;
            }

            .result-line h2 {
                font-size: 3.1rem;
            }

            .result-line span {
                font-size: 2.4rem;
            }

            .accuracy-line p {
                font-size: 0.98rem;
            }

            .metric-item {
                font-size: 0.95rem;
                padding: 6px 16px;
            }

            .edge-glow-left,
            .edge-glow-right {
                height: 104px;
                top: 35%;
            }
        }

        /* DO NOT GROW ANY FURTHER AFTER 850px */
        @media (min-width: 992px) {
            .container {
                width: var(--content-locked-width);
                max-width: var(--content-locked-width);
            }

            .intro {
                width: var(--intro-locked-width);
                max-width: var(--intro-locked-width);
            }

            .calc-shell {
                width: var(--card-locked-width);
                max-width: var(--card-locked-width);
            }
        }

        @media (min-width: 1200px) {
            .container {
                width: var(--content-locked-width);
                max-width: var(--content-locked-width);
            }

            .intro {
                width: var(--intro-locked-width);
                max-width: var(--intro-locked-width);
            }

            .calc-shell {
                width: var(--card-locked-width);
                max-width: var(--card-locked-width);
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            <header>
                <div class="brand-stack">
                    <div class="logo-row">
                        <img src="logo.png" alt="MetricFlow logo" title="MetricFlow Logo" />

                        <div class="brand-copy">
                            <h1>Metric<span class="flow">Flow</span></h1>
                            <p class="caption">Precision Unit Converter</p>
                        </div>
                    </div>
                </div>

                <hr class="logo-divider" />
            </header>

            <section class="intro">
                <p>
                    Convert between millimeters, centimeters, decimeters, meters, and
                    kilometers with speed, clarity, and accuracy.
                </p>
            </section>

            <main>
                <section class="calc-shell">
                    <span class="edge-glow-left" aria-hidden="true"></span>
                    <span class="edge-glow-right" aria-hidden="true"></span>

                    <div class="calc-panel">
                        <div class="value-block">
                            <div class="field-heading">
                                <hr />
                                <p>Enter value</p>
                                <hr />
                            </div>

                            <form action="">
                                <input
                                    class="value-input"
                                    type="text"
                                    name="calc-value"
                                    id="calc-value"
                                    placeholder="1,500"
                                    inputmode="decimal"
                                    autocomplete="off"
                                />
                            </form>
                        </div>

                        <div class="unit-row">
                            <div class="select-wrap">
                                <select name="unit-from" id="unit-from">
                                    <option value="millimeters" selected>Millimeters (mm)</option>
                                    <option value="centimeters">Centimeters (cm)</option>
                                    <option value="decimeters">Decimeters (dm)</option>
                                    <option value="meters">Meters (m)</option>
                                    <option value="kilometers">Kilometers (km)</option>
                                </select>
                            </div>

                            <div class="swap-wrap">
                                <div class="swap-button" aria-hidden="true">↔</div>
                            </div>

                            <div class="select-wrap">
                                <select name="unit-to" id="unit-to">
                                    <option value="millimeters">Millimeters (mm)</option>
                                    <option value="centimeters">Centimeters (cm)</option>
                                    <option value="decimeters">Decimeters (dm)</option>
                                    <option value="meters" selected>Meters (m)</option>
                                    <option value="kilometers">Kilometers (km)</option>
                                </select>
                            </div>
                        </div>

                        <div class="result-box">
                            <div class="result-line">
                                <h2 id="data-from">1,500 mm</h2>
                                <span>=</span>
                                <h2 id="data-to">1.5 m</h2>
                            </div>

                            <div class="accuracy-line">
                                <p>Accurate to standard metric scale</p>
                            </div>
                        </div>

                        <div class="metrics-strip">
                            <div class="metric-item">10 mm = 1 cm</div>
                            <div class="metric-item">10 cm = 1 dm</div>
                            <div class="metric-item">10 dm = 1 m</div>
                            <div class="metric-item">1000 m = 1 km</div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
